# Camera registry (demo setup, 12 Oct): laptop webcam + 2 phones, all on the same Wi-Fi as the ESP32 station.
# source can be:
#   0, 1 ...                 -> laptop / USB webcam index
#   demo/clips/xxx.mp4       -> recorded video (looped)
#   http://IP:8080/video     -> phone (IP Webcam app) or RTSP url
# Phone addresses change when a phone reconnects to Wi-Fi:
#   python -m tools.find_phones           -> lists phones running IP Webcam on this Wi-Fi
#   python -m tools.find_phones --write   -> puts them into cam_02 / cam_03 below
# rotate: 90 | 180 | 270     -> turn the picture clockwise (phone mounted upright gives a sideways picture)
# enabled: false             -> camera not started; its tile shows "switched off"
# share: <name>              -> camera PAIR used one at a time (not used in this setup)
# zones: polygons in NORMALISED coordinates (0..1), checked at the worker's feet.
# A worker outside every polygon falls back to default_zone.
cameras:
  cam_01:
    name: Welding bay
    source: 1                               # 5 Nov: LAPTOP webcam (HP) = index 1 on this laptop while the USB webcam is plugged in
    default_zone: welding_bay
    zones: []
  cam_02:
    name: Warehouse
    source: http://192.168.60.53:8080/video     # PHONE 1, IP Webcam app (6 Nov: Wi-Fi 192.168.60.x, laptop .49)
    rotate: 90
    default_zone: warehouse
    zones: []
  cam_03:
    name: Assembly line
    enabled: true                           # 6 Nov: second phone connected
    source: http://192.168.60.58:8080/video       # PHONE 2, IP Webcam app (6 Nov)
    rotate: 90
    default_zone: assembly_line
    zones: []
  cam_04:
    name: Main entrance
    role: entrance                          # 29 Oct: automatic PPE check at the door (edge/entrance.py)
    source: 0                               # 5 Nov: USB webcam (Logi C270) = index 0 when plugged in. Swapped? swap 0 / 1 here and in cam_01
    default_zone: main_entrance             # required PPE = zones.yaml main_entrance
    capture: {width: 1280, height: 720, fps: 30, mjpg: true}
    zones: []
    # Mount it 2-3 m in front of the door at chest height so the WHOLE body (head to shoes) is in the picture.
    # One person at a time; a person farther away is asked to step closer.
