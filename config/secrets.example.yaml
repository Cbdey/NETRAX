# Copy this file to config/secrets.local.yaml and fill it in. secrets.local.yaml is in .gitignore
# and must never be pushed or shared. Environment variables with the same meaning also work
# (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM,
#  ALERT_PHONE_TO, SMTP_USER, SMTP_PASSWORD, ALERT_EMAIL_TO).

telegram:
  bot_token: ""            # from @BotFather, e.g. 123456789:AA...
  chat_id: ""              # group id (negative number). Find it: python -m tools.notify_setup telegram

twilio:                    # https://console.twilio.com  (trial: only VERIFIED numbers can receive)
  account_sid: ""          # AC...
  auth_token: ""
  from_number: ""          # your Twilio number, e.g. +1415...
  to_numbers: []           # e.g. ["+9198xxxxxxxx"]  (E.164 format, verified in Twilio)
  mode: auto               # auto | trial | full. TRIAL accounts only allow Twilio's template call / SMS (no custom
                           # text): auto tries the full alert text and falls back to the template automatically.

email:
  smtp_host: smtp.gmail.com
  smtp_port: 465
  username: ""                # your Gmail address
  app_password: ""            # Google app password (16 letters) - NEVER in this file
  to: []                      # e.g. ["supervisor@example.com"]
call:                      # 11 Nov: who is CALLED for a critical fire / smoke (config/notify.yaml phone.provider)
  to: []                   # the supervisor's phone number(s), e.g. ["+9198xxxxxxxx"] - used by the Android SIM call AND the
                           # CallMeBot Telegram call (that person sends /start to @CallMeBot_txtbot once)
  adb_path: ""             # android only, if adb is not on PATH, e.g. C:/platform-tools/adb.exe
  adb_device: ""           # optional: phone serial, or Wi-Fi address like "192.168.60.70:5555" (adb over Wi-Fi)
assistant:                 # optional: an LLM only re-words the database results (never invents events)
  anthropic_api_key: ""    # leave empty: the built-in query engine works fully offline
