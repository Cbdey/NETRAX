<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NETRAX — Industrial Safety Intelligence</title>
<script>
/* same saved day / night choice as the other NETRAX pages */
(function(){ var t = new URLSearchParams(location.search).get("theme"); try { t = t || localStorage.getItem("netrax-theme") || localStorage.getItem("netrax-cr-theme"); } catch(e){}
  document.documentElement.dataset.theme = t === "light" ? "light" : "dark"; })();
</script>
<style>
/* 11 Nov redesign: every section has ONE job, its own colour, and its own bordered containers. No data is shown twice. */
:root{
  --bg:#070d1a; --panel:#0e1628; --panel2:#141e34; --line:#1e2a44; --ink:#e8eef8; --ink2:#c3cede; --muted:#8fa0b8; --grid:#1b2740;
  --ok:#22c55e; --warn:#f59e0b; --serious:#f97316; --crit:#ef4444; --grey:#64748b;
  --ok-bg:rgba(34,197,94,.13); --warn-bg:rgba(245,158,11,.14); --crit-bg:rgba(239,68,68,.14); --grey-bg:rgba(100,116,139,.16);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 14px 34px -18px rgba(0,0,0,.75);
  --display:"Bahnschrift","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --a:#2dd4bf; --a2:#38bdf8; color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#eef2f8; --panel:#ffffff; --panel2:#f5f7fb; --line:#e1e7f0; --ink:#0f172a; --ink2:#334155; --muted:#5b6b82; --grid:#e8edf4;
  --ok:#16a34a; --warn:#b45309; --serious:#c2410c; --crit:#dc2626; --grey:#64748b;
  --ok-bg:#dcfce7; --warn-bg:#fef3c7; --crit-bg:#fee2e2; --grey-bg:#eef1f5;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 12px 30px -18px rgba(15,23,42,.25); color-scheme:light;
}
/* one colour pair per section */
.x-overview{--a:#2dd4bf;--a2:#38bdf8}.x-sensors{--a:#22d3ee;--a2:#0ea5e9}.x-ai{--a:#a78bfa;--a2:#6366f1}.x-workers{--a:#f472b6;--a2:#db2777}
.x-alerts{--a:#fb923c;--a2:#ef4444}.x-predict{--a:#facc15;--a2:#f59e0b}.x-map{--a:#34d399;--a2:#059669}.x-devices{--a:#60a5fa;--a2:#2563eb}.x-reports{--a:#c084fc;--a2:#9333ea}
.c-fire{--a:#f97316;--a2:#ef4444}.c-ppe{--a:#facc15;--a2:#f97316}.c-acc{--a:#f472b6;--a2:#e11d48}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:radial-gradient(1000px 520px at 10% -10%,rgba(45,212,191,.12),transparent 60%),radial-gradient(900px 520px at 105% 0%,rgba(129,140,248,.15),transparent 60%),
  radial-gradient(900px 600px at 50% 120%,rgba(244,114,182,.07),transparent 60%),var(--bg);background-attachment:fixed}
:root[data-theme="light"] body{background:radial-gradient(1000px 520px at 10% -10%,rgba(45,212,191,.14),transparent 60%),radial-gradient(900px 520px at 105% 0%,rgba(129,140,248,.13),transparent 60%),var(--bg);background-attachment:fixed}
button,select,input{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.app>div{min-width:0}
/* sidebar */
.side{background:color-mix(in srgb,var(--panel) 92%,transparent);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:11px;align-items:center;padding:4px 6px 16px}
.brand .lg{width:42px;height:42px;border-radius:13px;background:conic-gradient(from 210deg,#2dd4bf,#38bdf8,#818cf8,#f472b6,#2dd4bf);display:grid;place-items:center;font:800 var(--fs-l,19px) var(--display);color:#04121a;box-shadow:0 8px 20px -8px rgba(56,189,248,.8)}
.brand b{display:block;font:700 var(--fs-m,16px) var(--display);letter-spacing:.08em}
.brand small{color:var(--muted);font-size:var(--fs-xs,13px);letter-spacing:.16em;text-transform:uppercase}
#nav{display:flex;flex-direction:column;gap:3px}
.navb{display:flex;gap:11px;align-items:center;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:13px;padding:7px 9px;cursor:pointer;transition:background .15s}
.navb .ic{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;font-size:var(--fs-m,16px);color:#fff;background:linear-gradient(135deg,var(--a),var(--a2));opacity:.85;box-shadow:0 6px 14px -8px var(--a)}
.navb b{display:block;font-weight:700;font-size:var(--fs-s,14px)}
.navb small{display:block;color:var(--muted);font-size:var(--fs-xs,13px)}
.navb:hover{background:var(--panel2)}
.navb[aria-current="page"]{background:linear-gradient(90deg,color-mix(in srgb,var(--a) 18%,transparent),transparent);border-color:color-mix(in srgb,var(--a) 40%,transparent)}
.navb[aria-current="page"] .ic{opacity:1}
.navb .n{margin-left:auto;min-width:22px;text-align:center;font-size:var(--fs-xs,13px);font-weight:800;border-radius:999px;padding:1px 7px;background:var(--crit);color:#fff;animation:blink 1.6s infinite}
.navb .n:empty{display:none}
.side .sp{flex:1}
.side .foot{font-size:var(--fs-xs,13px);color:var(--muted);padding:10px 8px;border-top:1px dashed var(--line);margin-top:8px}
/* top bar */
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 22px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(10px);position:sticky;top:0;z-index:20}
.top h1{margin:0;font:700 var(--fs-m,16px) var(--display);letter-spacing:.1em;background:linear-gradient(90deg,var(--ink),#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-theme="light"] .top h1{background:linear-gradient(90deg,#0f172a,#0369a1);-webkit-background-clip:text;background-clip:text}
.top p{margin:0;color:var(--muted);font-size:var(--fs-s,14px)}
.nxnav{margin-left:auto;display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);flex-wrap:wrap}
.nxnav a{font-size:var(--fs-s,14px);font-weight:700;text-decoration:none;border-radius:9px;padding:5px 10px;color:var(--muted)}
.nxnav a:hover{color:var(--ink)}.nxnav a[aria-current="page"]{background:linear-gradient(135deg,#2dd4bf,#38bdf8);color:#04121a}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;font-size:var(--fs-xs,13px);font-weight:800;letter-spacing:.06em;background:var(--ok-bg);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor;animation:blink 1.6s infinite}
.pill.off{background:var(--crit-bg);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
.tbtn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:6px 11px;cursor:pointer;font-size:var(--fs-s,14px);font-weight:700}
@keyframes blink{50%{opacity:.35}}
main{padding:18px 22px 60px;max-width:1720px}
section.sec{display:none}
section.sec.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* section banner */
.banner{display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:20px;margin-bottom:14px;border:1px solid color-mix(in srgb,var(--a) 35%,var(--line));
  background:linear-gradient(120deg,color-mix(in srgb,var(--a) 20%,transparent),color-mix(in srgb,var(--a2) 8%,transparent) 55%,transparent),var(--panel);box-shadow:var(--shadow);position:relative;overflow:hidden}
.banner::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--a2) 25%,transparent),transparent 70%)}
.banner .bic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:var(--fs-xl,24px);color:#fff;background:linear-gradient(135deg,var(--a),var(--a2));box-shadow:0 10px 24px -10px var(--a);flex:none}
.banner h2{margin:0;font:700 var(--fs-l,19px) var(--display);letter-spacing:.03em}
.banner p{margin:2px 0 0;color:var(--ink2);font-size:var(--fs-s,14px);max-width:900px}
.banner .rt{margin-left:auto;position:relative;z-index:1}
/* containers */
.box{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:0 16px 16px;box-shadow:var(--shadow);min-width:0;transition:border-color .25s,box-shadow .25s}
.box::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:18px 18px 0 0;background:linear-gradient(90deg,var(--a),var(--a2))}
.bh{display:flex;align-items:center;gap:10px;padding:13px 0 11px;margin-bottom:12px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.bh .bi{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;font-size:var(--fs-m,16px);font-style:normal;
  background:linear-gradient(135deg,color-mix(in srgb,var(--a) 30%,transparent),color-mix(in srgb,var(--a2) 16%,transparent));border:1px solid color-mix(in srgb,var(--a) 45%,transparent)}
.bh h3{margin:0;font:700 var(--fs-m,16px) var(--display);letter-spacing:.02em}
.bh p{margin:1px 0 0;font-size:var(--fs-xs,13px);color:var(--muted)}
.bh .sp{flex:1}
.box.hot{border-color:color-mix(in srgb,var(--crit) 55%,var(--line))}
.box.bump{animation:boxpop .55s cubic-bezier(.2,1.35,.4,1),boxglow 1.2s ease-in-out .15s 2}
@keyframes boxpop{35%{transform:scale(1.012)}}
@keyframes boxglow{50%{border-color:var(--a);box-shadow:0 0 0 2px var(--a),0 16px 44px -10px var(--a)}}
.grid{display:grid;gap:14px;align-items:start}
.kp{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}@media (max-width:1100px){.kp{grid-template-columns:repeat(2,minmax(0,1fr))}}@media (max-width:560px){.kp{grid-template-columns:1fr}}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.cardsL{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.camsL{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.muted{color:var(--muted)}.small{font-size:var(--fs-s,14px)}.mt{margin-top:14px}
/* status language: always dot + word, never colour alone */
.st{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs,13px);font-weight:800;letter-spacing:.05em;border-radius:999px;padding:3px 10px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.ok{color:var(--ok);background:var(--ok-bg)}.st.warn{color:var(--warn);background:var(--warn-bg)}
.st.crit{color:var(--crit);background:var(--crit-bg)}.st.off{color:var(--grey);background:var(--grey-bg)}
/* hero */
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;border-radius:22px;padding:22px 24px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 220px at 0% 50%,color-mix(in srgb,var(--hc) 22%,transparent),transparent 70%);pointer-events:none}
.hero>*{position:relative}
.hero{--hc:var(--grey)}.hero.ok{--hc:var(--ok)}.hero.warn{--hc:var(--warn)}.hero.crit{--hc:var(--crit);border-color:var(--crit)}
.hero .ring{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;font-size:var(--fs-num,34px);font-weight:800;color:#fff;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--hc) 85%,#fff),var(--hc));box-shadow:0 0 0 8px color-mix(in srgb,var(--hc) 18%,transparent),0 14px 30px -10px var(--hc)}
.hero.crit .ring{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 16px color-mix(in srgb,var(--hc) 6%,transparent),0 14px 30px -10px var(--hc)}}
.hero .lbl{font-size:var(--fs-xs,13px);letter-spacing:.2em;color:var(--muted);font-weight:800}
.hero .big{font:800 var(--fs-num,34px)/1.05 var(--display);letter-spacing:.04em;color:var(--hc)}
.hero ul{margin:6px 0 0;padding-left:18px;color:var(--ink2);font-size:var(--fs-s,14px)}
/* KPI tiles */
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 15px;box-shadow:var(--shadow);
  transition:transform .15s,border-color .15s;position:relative;overflow:hidden;min-width:0}
.tile::after{content:"";position:absolute;right:-40px;bottom:-60px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--a) 22%,transparent),transparent 70%)}
.tile:hover,.tile:focus-visible{transform:translateY(-2px);border-color:var(--a)}
.tile.static{cursor:default}.tile.static:hover{transform:none;border-color:var(--line)}
.tile .ti{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:var(--fs-l,19px);color:#fff;background:linear-gradient(135deg,var(--a),var(--a2));box-shadow:0 8px 18px -8px var(--a)}
.tile>div{min-width:0;flex:1}
.tile .k{font-size:var(--fs-xs,13px);color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:800;display:flex;justify-content:space-between;gap:6px;align-items:center}
.tile .v{font:700 var(--fs-xl,24px)/1.15 var(--display);margin-top:2px;font-variant-numeric:tabular-nums}
.tile .v small{font:600 var(--fs-s,14px) "Segoe UI",sans-serif;color:var(--muted);margin-left:4px}
.tile .n{font-size:var(--fs-s,14px);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* charts */
.ch{position:relative;width:100%}
.ch svg{display:block;width:100%;height:100%;overflow:visible}
.ch .ln{fill:none;stroke:var(--a2);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ch .ar{fill:color-mix(in srgb,var(--a2) 16%,transparent);stroke:none}
.ch .fc{fill:none;stroke:var(--a2);stroke-width:2;stroke-dasharray:5 5;opacity:.8}
.ch .gr{stroke:var(--grid);stroke-width:1}
.ch .thr{stroke:var(--crit);stroke-width:1.3;stroke-dasharray:6 4}
.ch .base{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 4}
.ch .hx{stroke:var(--muted);stroke-width:1;display:none}
.ch .now{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3}
.ch .dot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--a2);border:2px solid var(--panel);transform:translate(-50%,-50%);display:none;pointer-events:none}
.ch .yl{position:absolute;left:4px;font-size:var(--fs-xs,13px);color:var(--muted);pointer-events:none;background:var(--panel);padding:0 3px;border-radius:3px}
.ch .tl{position:absolute;right:4px;font-size:var(--fs-xs,13px);color:var(--crit);font-weight:700;transform:translateY(-110%);pointer-events:none}
.ch .none{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:var(--fs-s,14px);border:1px dashed var(--line);border-radius:10px}
.xl{display:flex;justify-content:space-between;font-size:var(--fs-xs,13px);color:var(--muted);margin-top:3px}
#tip{position:fixed;z-index:200;pointer-events:none;display:none;background:var(--ink);color:var(--bg);font-size:var(--fs-s,14px);font-weight:600;padding:4px 9px;border-radius:7px;white-space:nowrap}
.sens{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px 10px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.sens::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ok)}
.sens.warn::before{background:var(--warn)}.sens.crit::before{background:var(--crit)}.sens.off::before{background:var(--grey)}
.sens.crit{border-color:color-mix(in srgb,var(--crit) 50%,var(--line));background:linear-gradient(180deg,var(--crit-bg),var(--panel) 50%)}
.sens .k{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:var(--fs-s,14px);color:var(--ink2);font-weight:700}
.sens .v{font:700 var(--fs-num,34px)/1.2 var(--display);font-variant-numeric:tabular-nums;margin:2px 0}
.sens .v small{font:600 var(--fs-s,14px) "Segoe UI",sans-serif;color:var(--muted);margin-left:4px}
.sens .n{font-size:var(--fs-xs,13px);color:var(--muted);min-height:17px;margin-bottom:4px}
/* bars */
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:16px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:var(--fs-xs,13px);color:var(--muted);min-width:0}
.bars .b i{display:block;width:100%;max-width:38px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--a),var(--a2));min-height:3px}
.bars .b span{font-weight:700;color:var(--ink2)}
.hb{display:grid;grid-template-columns:minmax(90px,1.1fr) 3fr auto;gap:8px;align-items:center;font-size:var(--fs-s,14px);margin:7px 0}
.hb i{display:block;height:10px;border-radius:0 5px 5px 0;background:linear-gradient(90deg,var(--a),var(--a2));min-width:3px}
.hb b{font-variant-numeric:tabular-nums}
/* tables */
table{width:100%;border-collapse:collapse;font-size:var(--fs-s,14px)}
th{text-align:left;font-size:var(--fs-xs,13px);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:color-mix(in srgb,var(--a) 6%,transparent)}
tr:last-child td{border-bottom:0}
.scroll{overflow:auto;max-height:560px}
.meter{display:inline-block;width:90px;height:8px;border-radius:999px;background:var(--panel2);vertical-align:middle;overflow:hidden;margin-right:8px;border:1px solid var(--line)}
.meter i{display:block;height:100%;border-radius:999px;background:var(--ok)}
.meter.warn i{background:var(--warn)}.meter.crit i{background:var(--crit)}
/* cameras */
.cam{background:var(--panel2);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.cam.crit{border-color:var(--crit);box-shadow:0 0 0 2px var(--crit-bg)}
.cam .pic{position:relative;background:#040912;aspect-ratio:16/10}
.cam .pic img{width:100%;height:100%;object-fit:contain;display:block}
.cam .pic .ov{position:absolute;inset:0;display:grid;place-items:center;color:#9fb0b7;font-size:var(--fs-s,14px);background:#040912;text-align:center;padding:10px}
.cam .pic .tag{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.65);color:#fff;font:700 var(--fs-xs,13px) var(--display);letter-spacing:.07em;padding:3px 8px;border-radius:6px}
.cam .pic .tag.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff4d4f;margin-right:6px;animation:blink 1.2s infinite}
.cam .pic .verd{position:absolute;right:8px;top:8px}
.cam .bd{padding:10px 12px}
.cam .bd .row{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:var(--fs-s,14px);padding:3px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:var(--fs-xs,13px);font-weight:700;border-radius:8px;padding:2px 8px;border:1px solid var(--line);background:var(--panel)}
.chip.bad{border-color:var(--crit);color:var(--crit);background:var(--crit-bg)}
.chip.good{border-color:transparent;color:var(--ok);background:var(--ok-bg)}
.mix{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--panel2);border:1px solid var(--line);gap:2px}
.mix i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--fs-s,14px);color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend span::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
/* alerts */
.tabs{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);width:fit-content;max-width:100%;overflow-x:auto}
.tab{border:0;background:transparent;border-radius:9px;padding:6px 13px;cursor:pointer;font-weight:700;font-size:var(--fs-s,14px);color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:linear-gradient(135deg,var(--a),var(--a2));color:#111}
.alist{display:flex;flex-direction:column;gap:9px;max-height:620px;overflow:auto;padding:2px}

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tfmt = t => new Date(t * 1000).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", second:"2-digit"});
const dfmt = t => t ? new Date(t * 1000).toLocaleString([], {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}) : "—";
const ago = t => { if (!t) return "—"; const s = Math.max(0, Date.now() / 1000 - t);
  return s < 60 ? Math.round(s) + " s ago" : s < 3600 ? Math.round(s / 60) + " min ago" : s < 86400 ? Math.round(s / 3600) + " h ago" : Math.round(s / 86400) + " d ago"; };
const dur = s => s == null ? "—" : s < 60 ? Math.round(s) + " s" : s < 3600 ? Math.round(s / 60) + " min" : (s / 3600).toFixed(1) + " h";
async function api(p, o){ const r = await fetch(p, o);
  if (r.status === 401){ location.href = "/login?next=/intelligence"; throw new Error("login"); }
  if (!r.ok) throw new Error(r.status); return r.json(); }
const st = (cls, txt) => `<span class="st ${cls}">${esc(txt)}</span>`;
const ITEM = {helmet:"Helmet", vest:"Safety vest", gloves:"Gloves", goggles:"Goggles", boots:"Safety shoes", mask:"Mask"};
const iname = i => ITEM[i] || i;
const zname = id => (ZONES.find(z => z.zone_id === id) || {}).name || id || "";
/* replace a block only when its content really changed: keeps scroll positions and avoids flicker */
function setHTML(id, h){ const el = $(id); if (el && el.dataset.h !== h){ el.innerHTML = h; el.dataset.h = h; } }
function bump(id){ const b = $(id); if (!b) return; b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump"); clearTimeout(b._bt); b._bt = setTimeout(() => b.classList.remove("bump"), 2800); }
const tipOf = t => String(t ?? "").replace(/<[^>]+>/g, "").replace(/"/g, "&quot;");
const head = (icon, title, sub, right) => `<div class="bh"><i class="bi" aria-hidden="true">${icon}</i><div><h3>${title}</h3></div>${sub ? `<span class="nx-info" tabindex="0" title="${tipOf(sub)}">i</span>` : ""}<span class="sp"></span>${right || ""}</div>`;
const banner = (s) => `<div class="banner"><div class="bic" aria-hidden="true">${s[1]}</div><div><h2>${esc(s[2])} <span class="nx-info" tabindex="0" title="${tipOf(s[4])}">i</span></h2></div><div class="rt" id="bn-${s[0]}"></div></div>`;

/* ------------------------------------------------------------------ data (all from existing NETRAX APIs, read-only) */
let ME = {role:"viewer"}, CAMS = {cameras:[], edge_online:false}, ZONES = [], HW = {devices:[], readers:[], thresholds:{}, present:[]},
    HIST = {}, EV = new Map(), FRESH = new Map(), WORKERS = [], SCANS = [], HEALTH = null, AN = null, WSOK = false, SEC = "overview",
    MAPSEL = null, ALTAB = "active", REP = null, LASTMOUSE = null, LOC = null;
const canAct = () => ME.role === "admin" || ME.role === "supervisor";

/* [id, icon, name, nav subtitle, what this section is for] */
const SECTIONS = [
  ["overview", "◉", "Overview", "Overall safety status", "The whole site in one look: overall status, the six key numbers and what needs attention now. Click a number to open its section."],
  ["sensors", "∿", "Live Sensors", "Real-time readings", "Every sensor of the ESP32 safety station, once a second, with live graphs. Red dashed line = danger limit, dotted line = the sensor's normal level."],
  ["ai", "◎", "AI Monitoring", "Intelligent detection", "Live camera pictures with the AI result on them, and how the AI is judging people right now."],
  ["workers", "☻", "Worker Management", "RFID and PPE tracking", "Registered workers, RFID cards, entry and exit, each worker's PPE record and safety score."],
  ["alerts", "⚠", "Alerts Centre", "Emergency notifications", "Every incident sorted into its own box: fire & smoke, PPE, restricted access. Acknowledge, resolve or mark a false alarm here."],
  ["predict", "↗", "Predictive Analytics", "Early risk warning", "Early warning before a limit is crossed: trend lines on the live sensors and a risk index per zone."],
  ["map", "▦", "Factory Map", "Zone-wise safety", "Live state of every zone. Click a zone for its people, alerts and devices."],
  ["devices", "⚙", "Device Health", "Hardware monitoring", "Condition of the hardware: ESP32 station and its sensors, RFID reader, cameras, the AI computer and alert channels."],
  ["reports", "▤", "Reports & Analytics", "History and exports", "Daily, weekly and monthly reports from the stored records, 7-day trends, PDF and Excel export."],
];
const SECOF = Object.fromEntries(SECTIONS.map(s => [s[0], s]));

/* sensor definitions: key, label, unit, absolute limit key, baseline key + rise key, decimals, minimum y-span */
const SENSORS = [
  {k:"temperature_c", label:"Temperature", dev:"DHT22", icon:"🌡", unit:"°C", thr:"temp_critical_c", base:"temp", rise:"temp_rise_c", dp:1, span:4, hz:"heat"},
  {k:"humidity_pct", label:"Humidity", dev:"DHT22", icon:"💧", unit:"%", dp:0, span:10},
  {k:"mq2_adc", label:"Smoke / combustible gas", dev:"MQ-2", icon:"💨", unit:"ADC", thr:"mq2_abs", base:"mq2", rise:"mq2_rise", dp:0, span:300, hz:"smoke"},
  {k:"mq135_adc", label:"Air quality", dev:"MQ-135", icon:"🌫", unit:"ADC", base:"mq135", rise:"mq135_rise", dp:0, span:300},
  {k:"pm2_5_ugm3", label:"Dust PM2.5", dev:"Sharp GP2Y1010", icon:"⛅", unit:"µg/m³", thr:"pm25_warn", dp:0, span:20, warnOnly:true},
  {k:"flame_detected", label:"Flame sensor", dev:"IR flame", icon:"🔥", bool:true, hz:"fire"},
  {k:"vibration_metric", label:"Vibration", dev:"MPU6050", icon:"📳", unit:"g", dp:3, span:0.2},
  {k:"helmet_fsr_adc", label:"Helmet pressure", dev:"FSR", icon:"⛑", unit:"ADC", thr:"fsr_contact", dp:0, span:400, contact:true},
];

const evList = () => [...EV.values()].filter(e => e.type !== "entrance_check" && e.type !== "test");
const isActive = e => (e.status === "open" || e.status === "escalated" || e.status === "verifying") && !e.ended_at;
const isAck = e => e.status === "acknowledged" && !e.ended_at;
const active = () => evList().filter(isActive);
const SEVR = {Critical:0, High:1, Medium:2, Low:3};
const isFire = e => e.type === "fire" || e.type === "smoke";
const bySev = (a, b) => (isFire(a) ? -1 : SEVR[a.severity] ?? 4) - (isFire(b) ? -1 : SEVR[b.severity] ?? 4) || (b.updated_at || b.received_at || 0) - (a.updated_at || a.received_at || 0);
function title(e){
  if (e.type === "ppe_missing") return "PPE violation";
  if (e.type === "fire") return "Fire detected" + (e.fire_level ? " · level " + e.fire_level : "");
  if (e.type === "smoke") return "Smoke detected" + (e.fire_level ? " · level " + e.fire_level : "");
  if (e.type === "unauthorized_entry") return "Unauthorised entry";
  return String(e.type || "alert").replace(/_/g, " ");
}
const who = e => e.type === "ppe_missing" || e.type === "unauthorized_entry" ? personText(e) : (e.worker_name ? `${e.worker_name} · ${e.worker_id || ""}` : (e.worker_id || ""));
const stationOf = zid => (HW.devices || []).find(d => d.zone_id === zid);
const devLevel = d => !d ? null : !d.online ? "OFFLINE" : ((d.eval || {}).level || "NORMAL");
const camLive = c => c.status === "ONLINE" || c.status === "DEGRADED";

function zoneState(z){
  const evs = active().filter(e => e.zone_id === z.zone_id), d = stationOf(z.zone_id), lvl = devLevel(d);
  const cams = CAMS.cameras.filter(c => c.zone_id === z.zone_id), camOn = cams.some(camLive);
  let s = "ok", why = "No active alert";
  if (evs.some(e => isFire(e) || e.severity === "Critical") || lvl === "CRITICAL"){ s = "crit"; why = evs.length ? title(evs.sort(bySev)[0]) : ((d.eval.reasons || [])[0] || "station critical"); }
  else if (evs.length || lvl === "WARNING" || lvl === "FAULT"){ s = "warn"; why = evs.length ? title(evs.sort(bySev)[0]) : lvl === "FAULT" ? "sensor fault" : ((d.eval.reasons || [])[0] || "station warning"); }
  else if (!camOn && (!d || !d.online)){ s = "off"; why = "No camera or station reporting"; }
  return {s, why, evs, d, cams, camOn};
}
function overall(){
  const a = active(), devs = HW.devices || [];
  const fire = a.filter(isFire);
  const reasons = [];
  let s = "ok";
  if (fire.length || a.some(e => e.severity === "Critical") || devs.some(d => devLevel(d) === "CRITICAL")){
    s = "crit";
    fire.forEach(e => reasons.push(`${title(e)}${who(e) ? " · " + who(e) : ""} — ${e.zone_name || e.zone_id || ""}`));
    a.filter(e => e.severity === "Critical" && !fire.includes(e)).forEach(e => reasons.push(`${title(e)}${who(e) ? " · " + who(e) : ""} — ${e.zone_name || ""}`));
    devs.filter(d => devLevel(d) === "CRITICAL").forEach(d => reasons.push(`${d.name}: ${(d.eval.reasons || []).join(", ")}`));
  } else if (a.length || devs.some(d => ["WARNING", "FAULT"].includes(devLevel(d)))){
    s = "warn";
    a.slice().sort(bySev).slice(0, 3).forEach(e => reasons.push(`${title(e)}${who(e) ? " · " + who(e) : ""} — ${e.zone_name || ""}`));
    devs.filter(d => ["WARNING", "FAULT"].includes(devLevel(d))).forEach(d => reasons.push(`${d.name}: ${(d.eval.reasons || ["warning"]).join(", ")}`));
  } else if (!CAMS.edge_online && !devs.some(d => d.online)){
    s = "off"; reasons.push("The AI cameras and the safety station are not reporting. Nothing is being watched right now.");
  } else {
    if (!CAMS.edge_online) reasons.push("AI cameras are not running — only the station sensors are watching.");
    if (devs.length && !devs.some(d => d.online)) reasons.push("Safety station offline — only the cameras are watching.");
  }
  return {s, reasons, fire};
}

/* ------------------------------------------------------------------ charts (inline SVG, no library, works offline) */
const CH = {};
function chart(id, pts, o){
  o = o || {}; const H = o.h || 110, W = 600;
  pts = (pts || []).filter(p => p[1] != null);
  if (pts.length < 2) return `<div class="ch" style="height:${H}px"><div class="none">${esc(o.empty || "Waiting for readings…")}</div></div>`;
  const fut = o.fut || [], all = pts.concat(fut).map(p => p[1]);
  let lo = Math.min(...all), hi = Math.max(...all);
  if (o.thr != null && (o.showThr || o.thr <= hi * 1.6)) { hi = Math.max(hi, o.thr); lo = Math.min(lo, o.thr); }
  if (o.base != null) { lo = Math.min(lo, o.base); hi = Math.max(hi, o.base); }
  const ms = o.span || 1e-6; if (hi - lo < ms){ const m = (hi + lo) / 2; hi = m + ms / 2; lo = m - ms / 2; }
  const pad = (hi - lo) * 0.08; hi += pad; lo -= pad; if (Math.min(...all) >= 0) lo = Math.max(0, lo);
  const t0 = pts[0][0], tN = pts[pts.length - 1][0], t1 = fut.length ? fut[fut.length - 1][0] : tN;
  const X = t => (t - t0) / Math.max(1e-6, t1 - t0) * W, Y = v => H - (v - lo) / (hi - lo) * H;
  const d = pts.map((p, i) => `${i ? "L" : "M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
  const area = `${d}L${X(tN).toFixed(1)},${H}L0,${H}Z`;
  const fd = fut.length ? `M${X(tN).toFixed(1)},${Y(pts[pts.length - 1][1]).toFixed(1)}` + fut.map(p => `L${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("") : "";

/* ------------------------------------------------------------------ sensor judgement + trend forecast */
function limitOf(c, d){
  const t = HW.thresholds || {}, b = ((d && d.eval) || {}).baseline || {};
  const est = c.k === "pm2_5_ugm3" && ((d && d.data) || {}).pm_estimated;          // uncalibrated estimate: no limit
  const abs = c.thr && !est ? t[c.thr] : null, rise = c.rise && b[c.base] != null && t[c.rise] != null ? b[c.base] + t[c.rise] : null;

}

  const v = (d.data || {})[c.k];

  if (c.bool) return v ? {cls:"crit", txt:"FLAME"} : {cls:"ok", txt:"NORMAL"};
  if (c.contact) return v >= (HW.thresholds.fsr_contact || 700) ? {cls:"ok", txt:"HELMET ON"} : {cls:"warn", txt:"NO CONTACT"};
  if (c.hz && ((d.eval || {}).hazards || {})[c.hz]) return {cls:"crit", txt:"DANGER"};
  const lim = limitOf(c, d);
  if (lim != null && v >= lim) return c.warnOnly ? {cls:"warn", txt:"WARNING"} : {cls:"crit", txt:"DANGER"};
  if (lim != null && v >= lim - (lim - (((d.eval || {}).baseline || {})[c.base] ?? lim * 0.6)) * 0.3) return {cls:"warn", txt:"NEAR LIMIT"};
  return {cls:"ok", txt:"NORMAL"};
}
/* least-squares line through the last `win` seconds; ETA = time until the line reaches the limit */
function trend(dev, c, d, win){
  const pts = series(dev, c.k, win || 180).filter(p => p[1] != null);

  const n = pts.length, t0 = pts[0][0];

  for (const [t, v] of pts){ const x = t - t0; sx += x; sy += v; sxx += x * x; sxy += x * v; }
  const den = n * sxx - sx * sx; if (!den) return null;
  const m = (n * sxy - sx * sy) / den, b = (sy - m * sx) / n;
  let res = 0; for (const [t, v] of pts){ const e = v - (m * (t - t0) + b); res += e * e; }
  const noise = Math.sqrt(res / n), spanT = pts[n - 1][0] - t0, change = m * spanT;
  const now = m * spanT + b, lim = limitOf(c, d);
  const real = Math.abs(change) > Math.max(2 * noise, (c.span || 1) * 0.15);     // a change clearly bigger than the sensor noise
  let eta = null;
  if (lim != null && real && m > 0 && now < lim) eta = (lim - now) / m;
  const fut = []; for (let s = 30; s <= 300; s += 30) fut.push([pts[n - 1][0] + s, now + m * s]);
  return {perMin: m * 60, real, eta, lim, now, fut, tEnd: pts[n - 1][0], noise};
}
function anomaly(dev, k){
  const v = series(dev, k, 600).map(p => p[1]).filter(x => x != null);
  if (v.length < 30) return null;
  const hist = v.slice(0, -5), last = v.slice(-5), mean = hist.reduce((a, b) => a + b, 0) / hist.length;
  const sd = Math.sqrt(hist.reduce((a, b) => a + (b - mean) * (b - mean), 0) / hist.length) || 1e-6;
  const cur = last.reduce((a, b) => a + b, 0) / last.length;
  return {mean, sd, cur, z: (cur - mean) / sd};
}
function zoneRisk(z){
  const zs = zoneState(z), d = zs.d; let sensor = 0, early = 0;
  if (d && d.online) for (const c of SENSORS){
    if (c.bool || c.contact) { if (c.bool && (d.data || {})[c.k]) sensor = 100; continue; }
    const v = (d.data || {})[c.k], lim = limitOf(c, d), b = ((d.eval || {}).baseline || {})[c.base];
    if (v == null || lim == null) continue;
    const from = b != null ? b : lim * 0.5;
    sensor = Math.max(sensor, Math.min(100, Math.max(0, (v - from) / Math.max(1e-6, lim - from) * 100)));
    const tr = trend(d.device_id, c, d); if (tr && tr.eta != null && tr.eta < 900) early = 15;
  }
  const al = Math.max(0, ...zs.evs.map(e => isFire(e) ? 100 : ({Critical:90, High:70, Medium:45, Low:25}[e.severity] || 25)));
  return {score: Math.round(Math.min(100, Math.max(sensor, al) + early)), sensor: Math.round(sensor), al, early, watched: zs.s !== "off"};
}

/* ------------------------------------------------------------------ 5 · Alerts Centre: three boxes, a new alert pops inside its own box */
const ALBOX = [
  ["fire", "c-fire", "🔥", "Fire & smoke", "Camera + station cross-check · level 1–3", isFire, "<b>✓ No fire or smoke</b>Cameras and the station are watching."],
  ["ppe", "c-ppe", "🦺", "PPE violations", "One alert per violation · per worker", e => !isFire(e) && e.type !== "unauthorized_entry", "<b>✓ No PPE violation</b>Everyone wears the required PPE."],
  ["acc", "c-acc", "⛔", "Restricted access", "Workers inside a zone they are not allowed in", e => e.type === "unauthorized_entry", "<b>✓ No unauthorised entry</b>Restricted zones are clear."],
];
const KEYED = new Map();
function alertHtml(e){
  const act = isActive(e), ackd = isAck(e);
  const icon = e.type === "fire" ? "🔥" : e.type === "smoke" ? "💨" : e.type === "unauthorized_entry" ? "⛔" : "🦺";
  const state = act ? st(e.status === "verifying" ? "warn" : "crit", e.status === "verifying" ? "VERIFYING" : e.status === "escalated" ? "ESCALATED" : "ACTIVE") : ackd ? st("warn", "ACKNOWLEDGED") :
    e.status === "dismissed" ? st("off", "FALSE ALARM") : e.status === "suppressed" ? st("off", "NOT CONFIRMED") : st("ok", "RESOLVED");
  const src = e.camera_id ? (e.camera_name || e.camera_id) : "safety station";
  return `${e.snapshot ? `<img src="${esc(e.snapshot)}" alt="" loading="lazy">` : `<div class="noimg">${icon}</div>`}
    <div><b>${esc(who(e) || title(e))}</b>${e.type === "ppe_missing" ? ppeRowFor(e, 28) : ""}<span class="sev ${esc(e.severity || "")}">${esc(e.severity || "")}</span><div style="margin-top:3px">${state}</div>
      <div class="m">${esc(e.zone_name || e.zone_id || "")} · ${esc(src)}</div>
      <div class="m">${dfmt(e.started_at)} · <span data-ago="${e.started_at}">${ago(e.started_at)}</span>${e.acked_by ? " · ack by " + esc(e.acked_by) : ""}</div></div>
    <div class="a">${canAct() && (act || ackd) ? `${act ? `<button class="btn pri" data-act="ack" data-id="${esc(e.event_id)}">Acknowledge</button>` : ""}<button class="btn" data-act="resolve" data-id="${esc(e.event_id)}">Resolve</button>${e.type !== "fire" ? `<button class="btn red" data-act="dismiss" data-id="${esc(e.event_id)}">False alarm</button>` : ""}` : ""}
      <a class="btn" href="/#event=${encodeURIComponent(e.event_id)}">Details ›</a></div>`;
}
function keyedList(boxId, listId, items, emptyHtml){
  const el = $(listId); let m = KEYED.get(listId); const first = !m; if (!m){ m = new Map(); KEYED.set(listId, m); }
  const keep = new Set(); let prev = null, added = false;
  el.querySelectorAll(":scope > .empty").forEach(n => n.remove());
  for (const e of items){
    const id = e.event_id; keep.add(id);
    const h = alertHtml(e).replace(/<span data-ago[^<]*<\/span>/, ""), cls = "al " + (e.severity || "");
    let r = m.get(id);
    if (!r){ r = {node: document.createElement("div"), sig: null}; m.set(id, r);
      if (!first && FRESH.has(id) && Date.now() - FRESH.get(id) < 15000){ r.pop = true; added = true; setTimeout(() => { r.pop = false; r.node.classList.remove("pop"); }, 4500); } }
    if (r.sig !== h){ r.node.className = cls + (r.pop ? " pop" : ""); r.node.innerHTML = alertHtml(e); r.sig = h; }
    const want = prev ? prev.nextSibling : el.firstChild; if (want !== r.node) el.insertBefore(r.node, want); prev = r.node;
  }
  for (const [id, r] of m) if (!keep.has(id)){ r.node.remove(); m.delete(id); }
  el.querySelectorAll("[data-ago]").forEach(x => { x.textContent = ago(+x.dataset.ago); });
  if (!items.length && !el.querySelector(".empty")) el.insertAdjacentHTML("beforeend", `<div class="empty">${emptyHtml}</div>`);
  if (added) bump(boxId);
}
function rAlerts(){

  if (!$("al-fire")){

      <div class="grid g3 mt">${ALBOX.map(b => `<div class="box ${b[1]}" id="al-${b[0]}">${head(b[2], b[3], b[4], `<span class="cnt" id="al-${b[0]}-n"></span>`)}<div class="alist" id="al-${b[0]}-l"></div></div>`).join("")}</div>

  if ($("al-tabs").innerHTML !== th) $("al-tabs").innerHTML = th;
  for (const b of ALBOX){

/* ------------------------------------------------------------------ 6 · Predictive Analytics */
function rPredict(){
  const devs = HW.devices || [];
  let html = banner(SECOF.predict) + `<div class="note">What this is, honestly: trend forecasting (a straight line through the last 3 minutes of each sensor, projected 5 minutes ahead) and a statistical vibration check. It is <b>not</b> a trained machine-learning model — that needs weeks of recorded sensor history from the real site first.</div>
    <div class="box mt">${head("🎯", "Zone risk index (0–100)", "Higher of: how close the worst sensor is to its limit, and the most serious active alert · +15 if a sensor will reach its limit within 15 min")}
      <div class="cards">${ZONES.map(z => { const r = zoneRisk(z); const col = r.score >= 70 ? "var(--crit)" : r.score >= 40 ? "var(--warn)" : "var(--ok)";
      return `<div class="rk"><div class="ring2" style="--p:${r.watched ? r.score : 0};--c:${col}"><div>${r.watched ? r.score : "—"}</div></div>
        <div><b style="font:700 var(--fs-m,16px) var(--display)">${esc(z.name)}</b><div class="small muted">${r.watched ? `sensors ${r.sensor} · alerts ${r.al}${r.early ? " · rising trend +15" : ""}` : "not watched (devices offline)"}</div></div></div>`; }).join("")}</div></div>`;
  for (const d of devs){
    const warn = [], cards = [];
    for (const c of SENSORS.filter(c => ["temperature_c", "mq2_adc", "mq135_adc", "pm2_5_ugm3"].includes(c.k))){
      const tr = d.online ? trend(d.device_id, c, d) : null, base = ((d.eval || {}).baseline || {})[c.base], lim = limitOf(c, d);
      const dir = !tr ? "" : !tr.real ? "steady" : tr.perMin > 0 ? "rising" : "falling";
      const over = tr && lim != null && tr.now >= lim;
      if (tr && !over && tr.eta != null && tr.eta < 900) warn.push(`${c.label} is rising ${Math.abs(tr.perMin).toFixed(c.dp || 1)} ${c.unit}/min — at this rate it reaches the limit (${Number(tr.lim).toFixed(c.dp)}) in about ${dur(tr.eta)}.`);
      const s = !tr ? {cls:"off", txt: d.online ? "COLLECTING" : "OFFLINE"} : over ? {cls:"crit", txt:"OVER LIMIT"} : tr.eta != null && tr.eta < 300 ? {cls:"crit", txt:"EARLY WARNING"} : tr.eta != null && tr.eta < 900 ? {cls:"warn", txt:"WATCH"} : {cls:"ok", txt:"STABLE"};
      cards.push(`<div class="sens ${s.cls}"><div class="k"><span>${c.icon} ${esc(c.label)} forecast</span>${st(s.cls, s.txt)}</div>
        <div class="v">${tr ? (tr.perMin >= 0 ? "+" : "") + tr.perMin.toFixed(c.k === "temperature_c" ? 2 : 1) : "—"}<small>${c.unit} per minute · ${dir || "no data"}</small></div>
        <div class="n">${tr ? (over ? `already above the limit (${Number(lim).toFixed(c.dp)}) — see Alerts Centre` : tr.eta != null ? `reaches the limit in about ${dur(tr.eta)} if this continues` : lim != null ? `not heading for the limit (${Number(lim).toFixed(c.dp)})` : "no limit set for this sensor") : d.online ? "needs about 20 readings" : "station offline"}</div>
        ${chart("p:" + d.device_id + ":" + c.k, series(d.device_id, c.k, 300), {thr: lim, showThr: tr && tr.eta != null && tr.eta < 900, base, dp: c.dp, unit: c.unit, span: c.span, h: 130, fut: tr ? tr.fut : [], label: c.label + " forecast", empty: d.online ? "Collecting readings…" : "Station offline"})}
        <div class="xl"><span>5 min ago</span><span>now</span><span>+5 min (projected)</span></div></div>`);
    }
    const an = d.online ? anomaly(d.device_id, "vibration_metric") : null;
    const lvl = devLevel(d);
    html += `<div class="box mt">${head("📈", `${esc(d.name)} — ${esc(zname(d.zone_id))}`, "Forecast of each gas / heat / dust sensor", lvl === "CRITICAL" ? st("crit", "ALREADY CRITICAL") : warn.length ? st("warn", "EARLY WARNING") : d.online ? st("ok", "NO DEVELOPING RISK") : st("off", "OFFLINE"))}
      ${warn.map(w => `<div class="att"><span class="d warn"></span><div><b>⚠ ${esc(w)}</b></div></div>`).join("") || `<div class="small muted" style="margin-bottom:10px">${lvl === "CRITICAL" ? "A limit is already crossed: " + esc((d.eval.reasons || []).join(" · ")) : d.online ? "No sensor is heading for its limit." : "No forecast while the station is offline."}</div>`}
      <div class="cardsL">${cards.join("")}
        <div class="sens ${an && Math.abs(an.z) > 3 ? "warn" : !an ? "off" : "ok"}"><div class="k"><span>📳 Abnormal vibration · MPU6050</span>${!an ? st("off", d.online ? "NO READING" : "OFFLINE") : Math.abs(an.z) > 3 ? st("warn", "ABNORMAL") : st("ok", "NORMAL")}</div>
          <div class="v">${an ? an.cur.toFixed(3) : "—"}<small>g · usual ${an ? an.mean.toFixed(3) : "—"}</small></div>
          <div class="n">${an ? `${Math.abs(an.z).toFixed(1)} standard deviations from the last 10 minutes (abnormal above 3)` : "this station does not send a vibration value"}</div>
          ${chart("p:" + d.device_id + ":vib", series(d.device_id, "vibration_metric", 600), {dp: 3, unit: "g", span: 0.05, h: 130, label: "vibration", empty: d.online ? "No vibration reading from this station" : "Station offline"})}
          <div class="xl"><span>10 min ago</span><span>now</span></div></div></div></div>`;
  }
  if (!devs.length) html += `<div class="box mt"><div class="empty" style="margin-top:16px">No safety station configured.</div></div>`;
  $("s-predict").innerHTML = html; rehover();
}

  loc: async () => { LOC = await api("/api/location"); },          // 12 Nov: station GPS (NEO-6M)
};
const run = k => jobs[k]().catch(() => {});
function connect(){
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/alerts`);
  ws.onopen = () => { WSOK = true; nav(); };
  ws.onmessage = m => { let msg; try { msg = JSON.parse(m.data); } catch (e) { return; } const {kind, data} = msg;
    if (kind === "hardware"){ HW = Object.assign(HW, data); pushHist(); }
    else if (kind === "event" && data && data.event_id){ const old = EV.get(data.event_id);
      if (isActive(data) && (!old || !isActive(old) || (old.items_missing || []).join() !== (data.items_missing || []).join() || (old.fire_level || 0) < (data.fire_level || 0))) FRESH.set(data.event_id, Date.now());
      EV.set(data.event_id, data); fireInit(); if (window.NetraxAlerts) NetraxAlerts.offer(data); run("zones").then(render); render(); }
    else if (kind === "attendance"){ Promise.all([run("scans"), run("hw"), run("zones")]).then(render); }
    else if (kind === "health"){ HEALTH = data; }
    else if (kind === "cameras"){ CAMS = data; }
    else if (kind === "workers"){ run("workers"); }
    else if (kind === "location"){ LOC = data; } };
  ws.onclose = ev => { WSOK = false; nav(); if (ev.code !== 4401) setTimeout(connect, 2000); };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
  setInterval(() => { if (ws.readyState === 1) ws.send("ping"); }, 20000);
}
(async function start(){
  try { ME = await api("/api/me"); } catch (e) { return; }
  $("clock").textContent = "starting…";
  await Promise.all(Object.keys(jobs).map(run));
  go(location.hash.slice(1) || "overview");
  connect();
  if (window.NetraxZentrix) NetraxZentrix.init({handlers: {theme: op => setTheme(op.mode), event: op => { ALTAB = "active"; go("alerts"); }}});
  setInterval(() => { $("clock").textContent = new Date().toLocaleTimeString("en-IN", {timeZone: "Asia/Kolkata", hour12: false});
    if (SEC !== "reports" || $("rPeriod")) render(); }, 1000);
  setInterval(() => { if (!WSOK) run("hw"); run("cams"); }, 2500);
  setInterval(() => { run("zones"); run("loc"); if (!WSOK) run("events"); }, 5000);
  setInterval(() => { run("an"); run("health"); run("scans"); }, 15000);
  setInterval(() => { run("workers"); run("events"); }, 60000);
})();
</script>
