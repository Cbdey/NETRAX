<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NETRAX Entrance</title>
<script>try { var t = new URLSearchParams(location.search).get("theme") || localStorage.getItem("netrax-cr-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="/static/nx.css?v=12nov1">
<style>
/* 12 Nov polish (Prompt 3): same panels, fonts and colours as the control room. Result = big PERMITTED / NOT PERMITTED
   + person + PPE icons; no sentences on the page ("how it works" is an (i) tooltip). */
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
a{color:var(--info)}
.wrap{padding:var(--sp-3) var(--sp-4) var(--sp-5);max-width:1920px;margin:0 auto;display:flex;flex-direction:column;gap:var(--sp-4)}
.muted{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--sp-4)}
.main{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(340px,1fr);gap:var(--sp-4);align-items:start}
.stack{display:flex;flex-direction:column;gap:var(--sp-4);min-width:0}
.feed{position:relative;aspect-ratio:16/9;background:#02060e;border-radius:var(--rad);overflow:hidden;display:grid;place-items:center;text-align:center;border:2px solid var(--line)}
.feed img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.feed.approved{border-color:var(--ok)}.feed.denied{border-color:var(--crit)}.feed.manual{border-color:var(--warn)}
.feed .tagL{position:absolute;top:var(--sp-3);left:var(--sp-3);z-index:2;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:var(--fs-xs);padding:5px 10px;border-radius:999px;background:rgba(4,10,20,.7);color:#fff}
.feedmsg{padding:0 28px;display:grid;gap:var(--sp-2);color:var(--muted)}.feedmsg b{font:600 var(--fs-xl)/1.15 var(--display);color:#e8effa}
.result{border-radius:var(--rad);padding:var(--sp-4);border:2px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--sp-3);align-items:center}
.result h3{margin:0;font:700 clamp(28px,3vw,40px)/1.05 var(--display);letter-spacing:.03em;color:var(--muted)}
.result .nx-person{font-size:var(--fs-l)}
.result .meta{font-size:var(--fs-s);color:var(--muted)}
.result img{height:110px;border-radius:10px;background:#000}
.result.approved{border-color:var(--ok);background:var(--ok-bg)}.result.approved h3{color:var(--ok)}
.result.denied{border-color:var(--crit);background:var(--crit-bg)}.result.denied h3{color:var(--crit)}
.result.manual{border-color:var(--warn);background:var(--warn-bg)}.result.manual h3{color:var(--warn)}
.result .acts{display:flex;gap:var(--sp-2)}
.zreq{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) 0;border-bottom:1px solid var(--line)}.zreq:last-child{border-bottom:0}
.zreq b{min-width:120px;font-weight:600}
.zreq .ppe-i small{display:none}.zreq .ppe-i{min-width:36px}
.kvs{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--sp-2) var(--sp-3);align-items:center}
.kvs>div:nth-child(odd){color:var(--muted);font-size:var(--fs-s)}
.kvs>div:nth-child(even){font-weight:600;display:flex;align-items:center;gap:var(--sp-2)}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:var(--fs-xs);font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-crit{background:var(--crit-bg);color:var(--crit)}.p-grey{background:var(--panel2);color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:var(--fs-s)}
th{text-align:left;color:var(--muted);font-weight:600;padding:var(--sp-2);border-bottom:1px solid var(--line)}
td{padding:var(--sp-2);border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--panel2)}
td img{width:72px;height:48px;object-fit:cover;border-radius:8px;display:block;background:#000}
td .ppe-i small{display:none}td .ppe-i{min-width:32px}
.tscroll{overflow:auto;max-height:560px}
.filters{display:flex;gap:var(--sp-1);flex-wrap:wrap;align-items:center}
.tab{min-height:34px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:0 var(--sp-3);font-weight:600;font-size:var(--fs-s);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--info);color:#fff;border-color:var(--info)}
.search{min-height:34px;padding:0 var(--sp-3);border-radius:999px;border:1px solid var(--line);background:var(--panel2);min-width:170px}
.empty{color:var(--muted);text-align:center;padding:var(--sp-4)}
.toasts{position:fixed;right:var(--sp-4);bottom:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-2);z-index:99;max-width:420px}
.toast{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--info);padding:10px 14px;border-radius:12px;font-size:var(--fs-s)}.toast b{display:block;font-size:var(--fs-m)}
#gateSide{display:flex;flex-direction:column;gap:var(--sp-2);max-height:440px;overflow:auto}
@media (max-width:1150px){.main{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.result{grid-template-columns:1fr}.result img{width:100%;height:auto}}
</style>
</head>
<body>
<div class="nxvig" aria-hidden="true"></div>
<div class="wrap">
<header class="nxbar">
  <a class="logo" href="/" aria-label="NETRAX home">N</a>
  <div class="brand"><b>NETRAX</b><span>Entrance</span></div>
  <span class="clock" id="clock" aria-label="Current time">--:--:--</span>
  <span class="hgrow"></span>
  <nav class="nxnav" aria-label="Pages"><a href="/">Control room</a><a href="/entrance" aria-current="page">Entrance</a><a href="/admin">Admin</a><a href="/hardware">Hardware</a><a href="/intelligence">Intelligence</a></nav>
  <span data-zx-slot></span>
  <button class="ibtn" id="themeBtn" aria-label="Switch day / night">☀ / ☾</button>
  <span class="chip" id="userChip">…</span>
</header>

<section class="kpis" aria-label="Today at the entrance">
  <div class="nx-kpi"><b id="kAll">–</b><span>Checks</span></div>
  <div class="nx-kpi ok"><b id="kOk">–</b><span>Permitted</span></div>
  <div class="nx-kpi" id="kbNo"><b id="kNo">–</b><span>Refused</span></div>
  <div class="nx-kpi" id="kbMan" title="checks waiting for a supervisor"><b id="kMan">–</b><span>Manual</span></div>
  <div class="nx-kpi"><b id="kUn">–</b><span>Unregistered</span></div>
  <div class="nx-kpi" title="RFID check-ins"><b id="kIn">–</b><span>Inside</span></div>
</section>

<div class="main">
  <div class="stack">
    <section class="nx-panel" aria-label="Entrance camera">
      <div class="nx-panel-head"><span class="ico" aria-hidden="true">📹</span><h2>Entrance camera</h2><span class="nx-count" id="camN">–</span></div>
      <div class="nx-panel-body">
        <div class="feed" id="feed"><span class="tagL" id="tagL" hidden><span class="nx-dot ok"></span>LIVE</span><div class="feedmsg" id="feedMsg"></div></div>
        <div class="result" id="result" aria-live="polite"></div>
      </div>
    </section>
  </div>
  <div class="stack">
    <section class="nx-panel" aria-label="Entrance alerts">
      <div class="nx-panel-head"><span class="ico" aria-hidden="true">🚪</span><h2>Entrance alerts</h2><span class="nx-count" id="gateCount">–</span></div>
      <div class="nx-panel-body"><div id="gateSide"></div></div>
    </section>
    <section class="nx-panel" aria-label="Required PPE">
      <div class="nx-panel-head"><span class="ico" aria-hidden="true">🦺</span><h2>Required PPE</h2>
        <span class="nx-info" tabindex="0" title="How verification works: 1) tap the RFID card or look at the camera (registered face or card = the worker's name, neither = unregistered). 2) stand in front of the camera for about 2 s, head to shoes, one person at a time. 3) green = enter, red = do not enter; an unclear picture or a card that does not match the face = manual check, never automatic approval.">i</span></div>
      <div class="nx-panel-body" id="req"></div>
    </section>
    <section class="nx-panel" aria-label="Entrance devices">
      <div class="nx-panel-head"><span class="ico" aria-hidden="true">🔌</span><h2>Devices</h2></div>
      <div class="nx-panel-body"><div class="kvs" id="dev"></div></div>
    </section>
    <section class="nx-panel" aria-label="Inside the site">
      <div class="nx-panel-head"><span class="ico" aria-hidden="true">👷</span><h2>Inside the site</h2><span class="nx-count" id="inN">–</span></div>
      <div class="nx-panel-body" id="inside"></div>
    </section>
  </div>
</div>

<section class="nx-panel" aria-label="Entrance log">
  <div class="nx-panel-head"><span class="ico" aria-hidden="true">📋</span><h2>Entrance log</h2>
    <span class="filters" role="group" aria-label="Filter"><button class="tab" data-f="all" aria-pressed="true">All</button><button class="tab" data-f="approved" aria-pressed="false">Permitted</button><button class="tab" data-f="denied" aria-pressed="false">Refused</button><button class="tab" data-f="manual" aria-pressed="false">Manual</button><button class="tab" data-f="unreg" aria-pressed="false">Unregistered</button>
      <label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden">Search</label><input class="search" id="q" placeholder="Search name or ID"></span></div>
  <div class="nx-panel-body"><div class="tscroll"><table><thead><tr><th>Photo</th><th>Time</th><th>Person</th><th>Result</th><th>PPE</th><th></th></tr></thead><tbody id="log"></tbody></table></div></div>
</section>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/static/ppe_icons.js?v=12nov1"></script>
<script src="/static/people.js?v=12nov1"></script>
<script src="/static/alerts.js?v=12nov1"></script>
<script src="/static/zentrix.js?v=12nov1"></script>
<script src="/static/video.js?v=12nov1"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TZ = "Asia/Kolkata", NA = NetraxAlerts;
const fmtT = t => t ? new Date(t*1000).toLocaleString("en-IN", {timeZone:TZ, day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit", hour12:false}) : "–";
const hhmm = t => t ? new Date(t*1000).toLocaleTimeString("en-IN", {timeZone:TZ, hour:"2-digit", minute:"2-digit", hour12:false}) : "–";
const dayStart = () => new Date(new Date().toLocaleString("en-US", {timeZone:TZ})).setHours(0,0,0,0) / 1000;
let ME = {role:"viewer"}, LOG = [], STATUS = null, PRESENT = [], ZONES = [], FILTER = "all";
const canAct = () => ME.role === "supervisor" || ME.role === "admin";
async function api(p, o){ const r = await fetch(p, o); if (r.status === 401){ location.href = "/login?next=/entrance"; throw new Error("login"); } if (!r.ok) throw new Error(r.status); return r.json(); }
const post = (p, b) => api(p, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(b||{})});
setInterval(() => { $("clock").textContent = new Date().toLocaleTimeString("en-IN", {timeZone:TZ, hour12:false}); }, 500);
$("themeBtn").onclick = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === "light" ? "dark" : "light"; try { localStorage.setItem("netrax-cr-theme", r.dataset.theme); } catch {} };
function toast(h, b){ const t = document.createElement("div"); t.className = "toast"; t.innerHTML = `<b>${esc(h)}</b>${esc(b)}`; $("toasts").prepend(t); setTimeout(() => t.remove(), 7000); }

const shown = g => (g.override ? g.override.decision : g.result);
const WORD = {approved: "PERMITTED", denied: "NOT PERMITTED", manual: "MANUAL CHECK"};
function renderKpis(){
  const d0 = dayStart(), td = LOG.filter(g => g.at >= d0);
  $("kAll").textContent = td.length;
  $("kOk").textContent = td.filter(g => shown(g) === "approved").length;
  const no = td.filter(g => shown(g) === "denied").length; $("kNo").textContent = no; $("kbNo").className = "nx-kpi" + (no ? " crit" : "");
  const wait = LOG.filter(g => g.result === "manual" && !g.override);
  $("kMan").textContent = td.filter(g => g.result === "manual").length; $("kbMan").className = "nx-kpi" + (wait.length ? " warn" : "");
  $("kbMan").title = wait.length ? `${wait.length} waiting for a supervisor` : "none waiting";
  $("kUn").textContent = td.filter(g => (g.identity||{}).kind === "unregistered").length;
  $("kIn").textContent = PRESENT.length; $("inN").textContent = PRESENT.length;
  $("inside").innerHTML = PRESENT.length ? `<table><tbody>${PRESENT.map(p => `<tr style="cursor:default"><td><span class="nx-person">${esc(p.name ? `${p.name} · ${p.worker_id}` : p.worker_id)}</span></td><td class="muted" style="text-align:right">since ${esc(hhmm(p.since))}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">Nobody inside</div>`;
}
/* big result of the latest decision: PERMITTED / NOT PERMITTED / MANUAL CHECK + person + icons (no sentences) */
function renderResult(){
  const g = LOG[0], el = $("result");
  if (!g){ el.className = "result"; el.innerHTML = `<div><h3>Waiting</h3><div class="meta">No check yet today</div></div>`; return; }
  const r = shown(g), w = NA.who(g), can = canAct() && g.result === "manual" && !g.override;
  el.className = "result " + r;
  el.innerHTML = `<div style="display:flex;flex-direction:column;gap:8px;min-width:0"><h3>${WORD[r] || r}</h3>
      <span class="nx-person">${esc(w.name)}</span>${ppeRowFor(g, 36)}
      <div class="meta">${esc(hhmm(g.at))}${(g.identity||{}).by ? ` · ${esc({face:"face", rfid:"RFID card", "face+rfid":"face + RFID card"}[g.identity.by] || g.identity.by)}` : ""}${g.override ? ` · decided by ${esc(g.override.by)}` : ""}</div>
      ${can ? `<div class="acts"><button class="btn btn-ok" data-d="approved" data-id="${esc(g.event_id)}">Allow</button><button class="btn btn-danger" data-d="denied" data-id="${esc(g.event_id)}">Refuse</button></div>` : ""}</div>
    ${g.snapshot ? `<img src="${esc(g.snapshot)}" alt="Picture at the check" onerror="this.remove()">` : ""}`;
  const recent = Date.now()/1000 - g.at < 15;
  $("feed").className = "feed" + (recent ? " " + r : "");
}
function renderSide(){
  NA.keyed($("gateSide"), LOG.slice(0, 8), x => x.event_id, NA.gateCard, "No checks yet");
  const td = LOG.filter(x => x.at >= dayStart());
  $("gateCount").textContent = `${td.length} today`;
}
function renderLog(){
  const q = $("q").value.trim().toLowerCase();
  const rows = LOG.filter(g => FILTER === "all" || (FILTER === "unreg" ? (g.identity||{}).kind === "unregistered" : shown(g) === FILTER))
    .filter(g => !q || `${(g.identity||{}).worker_id||""} ${(g.identity||{}).name||""}`.toLowerCase().includes(q));
  const html = rows.length ? rows.slice(0, 120).map(g => { const r = shown(g), w = NA.who(g);
    return `<tr data-open="${esc(g.event_id)}"><td>${g.snapshot ? `<img src="${esc(g.snapshot)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : ""}</td><td style="white-space:nowrap">${esc(fmtT(g.at))}</td>
      <td><span class="nx-person" style="font-size:var(--fs-s)">${esc(w.name)}</span></td>
      <td><span class="pill ${r === "approved" ? "p-ok" : r === "denied" ? "p-crit" : "p-warn"}" title="${esc(WORD[r] || r)}">${{approved:"✓ Permitted", denied:"✖ Refused", manual:"⚠ Manual"}[r]}</span></td>
      <td>${ppeRowFor(g, 26)}</td>
      <td style="white-space:nowrap">${g.result === "manual" && !g.override && canAct() ? `<button class="btn btn-ok" data-d="approved" data-id="${esc(g.event_id)}">Allow</button> <button class="btn btn-danger" data-d="denied" data-id="${esc(g.event_id)}">Refuse</button>` : ""}</td></tr>`; }).join("")
    : `<tr style="cursor:default"><td colspan="6" class="empty">No checks in this list</td></tr>`;
  if ($("log").dataset.h !== html){ $("log").innerHTML = html; $("log").dataset.h = html; }
}
function renderDevices(){
  const s = STATUS; if (!s) return;
  const c = s.camera || {}, live = c.status === "ONLINE" || c.status === "DEGRADED";
  $("camN").textContent = live ? `Live · ${c.fps} fps` : "Offline"; $("camN").className = "nx-count " + (live ? "ok" : "crit");
  $("feedMsg").hidden = live; $("tagL").hidden = !live;
  const f = $("feed"); let img = f.querySelector("img");
  if (live && !img){ img = document.createElement("img"); img.alt = "Live entrance camera"; img.id = "liveImg"; img.dataset.live = c.camera_id; f.prepend(img); }
  if (!live){ if (img) img.remove();
    $("feedMsg").innerHTML = `<b>Camera offline</b><span title="Plug in the USB webcam, then restart the edge (python -m edge.run_edge). If it stays offline try source: 2 for this camera in config/cameras.yaml.">${esc(c.detail || "No picture")} <span class="nx-info">i</span></span>`; }
  const rd = (s.readers||[])[0], rOk = rd && rd.online;
  $("dev").innerHTML = `<div>Camera</div><div><span class="nx-dot ${live ? "ok" : "crit"}"></span>${esc(c.name || "–")}</div>
    <div>RFID reader</div><div title="${rd ? esc(rd.device_id) : ""}"><span class="nx-dot ${rOk ? "ok" : rd ? "warn" : ""}"></span>${rd ? (rOk ? "Linked · " + esc(hhmm(rd.last_seen)) : rd.last_seen ? "Last " + esc(fmtT(rd.last_seen)) : "No scan yet") : "Not mapped"}</div>
    <div>Last card</div><div>${s.card ? `${esc(s.card.name ? s.card.name + " · " + s.card.worker_id : s.card.worker_id)} · ${esc(hhmm(s.card.at))}` : "–"}</div>
    <div>Gate</div><div><span class="nx-dot ${s.controller_connected ? "ok" : ""}"></span>${s.controller_connected ? "Lock connected" : "Advisory (no lock)"}</div>`;
  renderReq();
}
function renderReq(){
  const s = STATUS || {};
  const zones = ZONES.length ? ZONES.map(z => [z.name, z.required_ppe || []]) : [[s.zone_name || "Entrance", s.required || []]];
  $("req").innerHTML = zones.map(([n, r]) => `<div class="zreq"><b>${esc(n)}</b>${ppeRow(r, r, [], [], 30)}</div>`).join("");
}
document.addEventListener("click", async ev => {
  const d = ev.target.closest("[data-d]");
  if (d){ ev.stopPropagation(); d.disabled = true; try { await post(`/api/entrance/${d.dataset.id}/decide`, {decision:d.dataset.d, note:"manual check at the entrance"}); } catch { d.disabled = false; toast("Not saved", "Try again"); } return; }
  const o = ev.target.closest("[data-open]"); if (o) location.href = "/#event=" + encodeURIComponent(o.dataset.open);
  const f = ev.target.closest(".tab"); if (f){ FILTER = f.dataset.f; document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-pressed", x === f)); renderLog(); }
});
$("q").oninput = renderLog;
function renderAll(){ renderKpis(); renderResult(); renderSide(); renderLog(); }
async function slow(){
  try { STATUS = await api("/api/entrance/status"); renderDevices(); } catch {}
  try { PRESENT = (await api("/api/attendance/present")).filter(p => !STATUS || !STATUS.camera || p.zone_id === STATUS.camera.zone_id); renderKpis(); } catch {}
}
function connect(){
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/alerts`);
  ws.onmessage = m => { const {kind, data} = JSON.parse(m.data);
    if (kind === "entrance"){ LOG = [data].concat(LOG.filter(g => g.event_id !== data.event_id)); renderAll(); NA.gate(data); slow(); }
    else if (kind === "event") NA.offer(data);
    else if (kind === "attendance"){ toast(`RFID ${data.event || data.status || ""}`, data.message || ""); slow(); }
    else if (kind === "cameras" && STATUS){ STATUS.camera = (data.cameras||[]).find(c => c.role === "entrance") || STATUS.camera; renderDevices(); }
  };
  ws.onclose = ev => { if (ev.code === 4401){ location.href = "/login?next=/entrance"; return; } setTimeout(connect, 2000); };
  setInterval(() => ws.readyState === 1 && ws.send("ping"), 20000);
}
(async function boot(){
  try { ME = await api("/api/me"); } catch { return; }
  $("userChip").textContent = `👤 ${ME.user || "local"} · ${String(ME.role)}`;
  NA.init({canAct, role: () => ME.role, tone: () => {}, rail: "dock", railGate: false, view: id => { location.href = "/#event=" + encodeURIComponent(id); }});
  NetraxZentrix.init({});
  try { NA.seed(await api("/api/events?limit=300")); } catch {}
  try { LOG = await api("/api/entrance?limit=200"); } catch {}
  try { ZONES = await api("/api/zones"); } catch {}
  renderAll(); await slow(); connect();
  setInterval(slow, 5000); setInterval(() => { renderSide(); renderResult(); }, 5000);
})();
</script>
</body>
</html>
